<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Spam Detector</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h2>📱 SMS Spam Detector</h2>

        <p class="subtitle">
            Check whether a message is spam or legitimate.
        </p>

        <textarea
            id="message"
            placeholder="Enter an SMS message..."
            rows="6"
        ></textarea>

        <button id="predictButton">
            Check Message
        </button>

        <p id="result"></p>

    </div>

    <script src="popup.js"></script>

</body>
</html>
